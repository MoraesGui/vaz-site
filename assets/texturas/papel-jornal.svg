<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".48" intercept=".18"/>
        <feFuncG type="linear" slope=".44" intercept=".16"/>
        <feFuncB type="linear" slope=".36" intercept=".12"/>
        <feFuncA type="table" tableValues="0 .3"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .42" numOctaves="2" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
    </filter>
    <filter id="mottling" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <path d="M0 0h480v480H0z" filter="url(#mottling)"/>
  <path d="M0 0h480v480H0z" filter="url(#fibers)"/>
  <path d="M0 0h480v480H0z" filter="url(#grain)"/>
</svg>
